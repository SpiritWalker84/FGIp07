services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taskbot}
      MYSQL_USER: ${MYSQL_USER:-taskbot}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-secret}
    volumes:
      - taskbot_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  taskbot_mysql:
